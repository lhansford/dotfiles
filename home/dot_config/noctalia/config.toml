config_version = 8

[bar]
order = [ "default" ]

[bar.default]
capsule = true
capsule_radius = 8
capsule_thickness = 0.8
center = []
concave_edge_corners = false
end = [ "group:g1", "tray", "clock", "battery", "notifications", "control-center" ]
margin_edge = 8
margin_ends = 8
radius = 8
scale = 1.2
start = [ "active_window", "audio_visualizer", "media" ]
thickness = 40

[[bar.default.capsule_group]]
enabled = true
fill = "surface_variant"
id = "g1"
members = [ "cpu", "ram", "temp" ]
opacity = 1.0
padding = 6.0
radius = 8.0

[dock]
position = "top"

[location]
address = "Hong Kong"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@HDMI-A-2" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 810.0
cx = 1536.0
cy = 1546.0
output = "HDMI-A-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
box_height = 196.0
box_width = 810.0
cx = 1536.0
cy = 1546.0
output = "HDMI-A-2"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[shell]
avatar_path = "/home/luke/Dropbox/Media/Images/Avatars/notion-style/512x512-white.png"
clipboard_enabled = false
clipboard_keep_from_closed_apps = false
password_style = "random"
polkit_agent = true
screen_time_enabled = true

[shell.panel]
launcher_placement = "attached"
open_near_click_control_center = true

[shell.screen_corners]
enabled = true
size = 8

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

[theme.templates]
enable_builtin_templates = false

[wallpaper]
directory = "/home/luke/Dropbox/Media/Images/Backgrounds"

[wallpaper.default]
path = "/home/luke/Dropbox/Media/Images/Backgrounds/desk-gruvbox-material.jpg"

[widget.audio_visualizer]
bands = 64
mirrored = false
width = 128

[widget.clock]
format = "{:%H:%M %a, %b %d}"

[widget.control-center]
custom_image = "/usr/share/icons/cachyos.svg"
custom_image_colorize = true

[widget.cpu]
show_label = false

[widget.media]
art_size = 20
artist_first = true
hide_when_no_media = true
max_length = 320
title_scroll = "on_hover"

[widget.ram]
show_label = false

[widget.sysmon]
show_label = false

[widget.temp]
show_label = false
